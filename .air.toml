root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/auto_park ./cmd/auto_park"
bin = "./tmp/auto_park"
entrypoint = ["./tmp/auto_park"]

include_ext = ["go", "tpl", "tmpl", "html", "sql"]
exclude_dir = ["tmp", "vendor", ".git", "storage"]
exclude_regex = ["_test\\.go"]

poll = true
poll_interval = 500

delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[misc]
clean_on_exit = true